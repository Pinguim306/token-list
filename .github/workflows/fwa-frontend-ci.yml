name: fwa-frontend CI

on:
  push:
    branches: ["**"]
    paths: ["fwa-app/**", "fwa-indexer/**", ".github/workflows/fwa-frontend-ci.yml"]
  pull_request:
    paths: ["fwa-app/**", "fwa-indexer/**", ".github/workflows/fwa-frontend-ci.yml"]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fwa-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fwa-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fwa-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fwa-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No PLAYWRIGHT_CHROMIUM_PATH here: the container-local binary does not
      # exist on the runner, so the config falls back to the installed browser.
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: fwa-app/playwright-report/
          retention-days: 7

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fwa-indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fwa-indexer/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - run: npm run typecheck
