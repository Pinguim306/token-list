name: fwa-protocol CI

on:
  push:
    branches: ["**"]
    paths: ["fwa-protocol/**", ".github/workflows/fwa-protocol-ci.yml"]
  pull_request:
    paths: ["fwa-protocol/**", ".github/workflows/fwa-protocol-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fwa-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fwa-protocol/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
